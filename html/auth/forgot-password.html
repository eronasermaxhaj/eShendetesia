<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harruat Fjalëkalimin - eShendetesia</title>
    <link rel="stylesheet" href="../../css/auth/login.css">
</head>

<body>
    <main class="main-content" style="justify-content: center; padding: 0;">
        <div class="login-container" style="justify-content: center; flex: none; margin: 0;">
            <div class="login-box">
                <form id="forgotPasswordForm">
                    <h2 style="text-align: center;">Rikthimi i Fjalëkalimit</h2>
                    <p style="text-align: center; color: #666; margin-bottom: 20px;">
                        Shkruani Numrin tuaj Personal (ID) për të resetuar fjalëkalimin.
                    </p>

                    <div class="input-group">
                        <label for="resetId">Numri Personal (ID)</label>
                        <input type="text" id="resetId" placeholder="1234567890" maxlength="10" pattern="\d{10}"
                            required>
                    </div>

                    <!-- Step 2: New Password (Hidden initially) -->
                    <div id="newPasswordSection" style="display: none;">
                        <div class="input-group">
                            <label>Fjalëkalimi i Ri</label>
                            <input type="password" id="newPassword" placeholder="Fjalëkalimi i ri">
                        </div>
                        <div class="input-group">
                            <label>Konfirmo Fjalëkalimin</label>
                            <input type="password" id="confirmPassword" placeholder="Konfirmo fjalëkalimin">
                        </div>
                    </div>

                    <button type="submit" class="login-btn" id="submitBtn">Kërko Resetim</button>

                    <div class="form-footer">
                        <a href="login.html">Kthehu te Kyçja</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="../../js/auth.js"></script>
    <script src="../../js/forgot-password.js"></script>
</body>

</html>
